name: PJA110 5.15 SukiSU Ultra 40901 GKI构建

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android13'
  KERNEL_VERSION: '5.15'
  SUB_VERSION: '180'
  FAKE_SUFFIX: 'android13-8-o-01174-gae37bb2cf108'
  SUKISU_BUILTIN_COMMIT: 'e2912817f4e1b194e582a06e0b5eacf6a3fb7083'
  SUSFS_COMMIT: '415e4143ee1dd557c54d2b3d94ef098e5d1236f4'

on:
  workflow_dispatch:
    inputs:
      susfs_enable:
        description: '启用官方 SUSFS 5.15 集成'
        required: true
        type: boolean
        default: true
      kpm_enable:
        description: '启用 SukiSU 内置 KPM'
        required: true
        type: boolean
        default: true
      kernel_suffix:
        description: '内核后缀，留空使用原厂 KMI 后缀'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v4

      - name: 安装依赖并下载官方构建材料
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kernel_workspace
          mkdir -p kernel_workspace
          cd kernel_workspace

          # Google GKI 构建所需的主机依赖；失败时立即停止，避免生成不完整 Image。
          sudo apt-mark hold firefox >/dev/null 2>&1 || true
          sudo apt-mark hold libc-bin >/dev/null 2>&1 || true
          sudo apt purge -y man-db >/dev/null 2>&1 || true
          sudo rm -rf /var/lib/man-db/auto-update
          sudo apt update
          sudo apt-get install -y --no-install-recommends \
            binutils python-is-python3 libssl-dev libelf-dev libelf1
          test -r /usr/include/libelf.h
          echo 'libelf.h 已确认存在'

          aria2c -s16 -x16 -k1M --max-tries=5 --retry-wait=3 \
            'https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8550/archive/refs/heads/oneplus/sm8550_b_16.0.0_ace_2_pro.zip' \
            -o common.zip & common_pid=$!
          mkdir -p clang19
          aria2c -s16 -x16 -k1M --max-tries=5 --retry-wait=3 \
            'https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/clang-r536225.zip' \
            -o clang.zip & clang_pid=$!
          aria2c -s16 -x16 -k1M --max-tries=5 --retry-wait=3 \
            'https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/build-tools.zip' \
            -o build-tools.zip & tools_pid=$!
          wait "$common_pid"
          wait "$clang_pid"
          wait "$tools_pid"

          unzip -q common.zip
          mv android_kernel_common_oneplus_sm8550-oneplus-sm8550_b_16.0.0_ace_2_pro common
          unzip -q clang.zip -d clang19
          unzip -q build-tools.zip
          rm -f common.zip clang.zip build-tools.zip
          test -d common
          test -x clang19/bin/clang
          test -x clang19/bin/ld.lld

      - name: PJA110 源码树兼容适配
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace/common
          # OnePlus OSS 源码引用了未公开的 vendor gitlink；只移除确定存在的死引用。
          sed -i '/oplus_cpu\/sched\/Kconfig/d' init/Kconfig
          sed -i '/oplus\/storage\/Kconfig/d' drivers/soc/Kconfig
          sed -i '/oplus\/storage/d' drivers/soc/Makefile
          sed -i '/CONFIG_OPLUS_SCHED_TUNE=y/d' arch/arm64/configs/gki_defconfig
          # OnePlus 的连续 PTE 扩展使用文件系统 magic 常量，但源码遗漏了标准头文件。
          grep -q '^#include <linux/magic.h>' mm/cont_pte_hugepage.c || \
            sed -i '/#include <linux\/mm.h>/a #include <linux/magic.h>' mm/cont_pte_hugepage.c
          ! grep -q 'oplus_cpu/sched/Kconfig\|oplus/storage\|CONFIG_OPLUS_SCHED_TUNE=y' \
            init/Kconfig drivers/soc/Kconfig drivers/soc/Makefile arch/arm64/configs/gki_defconfig
          grep -q '^#include <linux/magic.h>' mm/cont_pte_hugepage.c

      - name: 使用 SukiSU 官方 builtin setup.sh
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace
          git clone --branch builtin https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          # 让官方脚本负责 pull、checkout 和 KernelSU 接入；参数固定到 4.2.0 builtin 提交。
          sh -eu KernelSU/kernel/setup.sh "$SUKISU_BUILTIN_COMMIT"
          test -L common/drivers/kernelsu
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' common/drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig
          grep -q '^obj-$(CONFIG_KSU) := ksu.o' KernelSU/kernel/Makefile
          grep -q '^config KSU$' KernelSU/kernel/Kconfig

          # builtin 提交当前仍缺少这个已被 handler 引用的定义，属于明确的源码兼容修复。
          if ! grep -q '^static int kernel_umount_feature_set' KernelSU/kernel/feature/kernel_umount.c; then
            sed -i '/^static const struct ksu_feature_handler kernel_umount_handler = {/i\static int kernel_umount_feature_set(u64 value)\n{\n    ksu_kernel_umount_enabled = value ? true : false;\n    return 0;\n}\n' KernelSU/kernel/feature/kernel_umount.c
          fi
          grep -q '^static int kernel_umount_feature_set' KernelSU/kernel/feature/kernel_umount.c

      - name: 应用官方 SUSFS 5.15 补丁
        if: inputs.susfs_enable
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace
          git clone --branch gki-android13-5.15 https://github.com/ShirkNeko/susfs4ksu.git susfs4ksu
          git -C susfs4ksu checkout "$SUSFS_COMMIT"
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch common/
          cp susfs4ksu/kernel_patches/fs/susfs.c common/fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h common/include/linux/
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h common/include/linux/
          cd common

          # 50_ 补丁是官方 GKI 5.15 内核补丁；-F3 仅处理 OnePlus OSS 的行号漂移。
          patch_status=0
          patch -p1 -N -F 3 < 50_add_susfs_in_gki-android13-5.15.patch || patch_status=$?
          if [ "$patch_status" -ne 0 ]; then
            echo "官方 SUSFS 补丁应用失败，退出码: $patch_status"
            find . -type f -name '*.rej' -print
            exit "$patch_status"
          fi
          if find . -type f -name '*.rej' -print -quit | grep -q .; then
            find . -type f -name '*.rej' -print
            exit 1
          fi
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          grep -q 'CONFIG_KSU_SUSFS' fs/exec.c fs/namespace.c security/selinux/hooks.c
          grep -q 'CONFIG_KSU_SUSFS_SUS_MAP' mm/memory.c

          # SukiSU builtin 4.2.0 已在 sucompat 中直接重定向 su，不再提供旧的会话 FD 接口。
          python3 - <<'PY'
          from pathlib import Path

          path = Path("fs/exec.c")
          source = path.read_text()
          replacements = {
              "extern int ksu_install_su_fd(void);\n": "",
              "\tbool is_su_session = false;\n": "",
              "is_su_session = !ksu_handle_execveat(": "(void)ksu_handle_execveat(",
              "is_su_session = !ksu_handle_execveat_sucompat(": "(void)ksu_handle_execveat_sucompat(",
              "#ifdef CONFIG_KSU_SUSFS\n\tif (unlikely(is_su_session && retval >= 0))\n\t\tksu_install_su_fd();\n#endif // #ifdef CONFIG_KSU_SUSFS\n": "",
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one legacy SukiSU fragment, found {count}: {old!r}")
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          ! grep -q 'ksu_install_su_fd\|is_su_session' fs/exec.c
          grep -q '(void)ksu_handle_execveat(' fs/exec.c
          grep -q '(void)ksu_handle_execveat_sucompat(' fs/exec.c

          # 该 include 在 OnePlus 源码上下文变化时由官方 hunk 无法定位，属于最小适配。
          grep -q 'linux/susfs_def.h' mm/memory.c || \
            sed -i '/#include <linux\/vmalloc.h>/a #include <linux/susfs_def.h>' mm/memory.c
          grep -q 'linux/susfs_def.h' mm/memory.c

      - name: 写入内核配置
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace/common
          if [[ -n "${{ inputs.kernel_suffix }}" ]]; then
            fake_suffix='${{ inputs.kernel_suffix }}'
          else
            fake_suffix="$FAKE_SUFFIX"
          fi
          printf 'FAKE_SUFFIX=%s\n' "$fake_suffix" >> "$GITHUB_ENV"

          # 先使用官方 gki_defconfig，再用 scripts/config 修改最终 .config。
          export PATH="$PWD/../clang19/bin:$PWD/../build-tools/bin:$PATH"
          make LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="$PWD/../clang19/bin/clang" LD="$PWD/../clang19/bin/ld.lld" \
            HOSTLD="$PWD/../clang19/bin/ld.lld" O=out gki_defconfig
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --set-str LOCALVERSION "-$fake_suffix"
          ./scripts/config --file out/.config --disable LOCALVERSION_AUTO
          ./scripts/config --file out/.config --enable LTO_NONE
          ./scripts/config --file out/.config --disable LTO_CLANG_THIN
          ./scripts/config --file out/.config --disable LTO_CLANG_FULL

          if [[ "${{ inputs.kpm_enable }}" == 'true' ]]; then
            ./scripts/config --file out/.config --enable KPM
          else
            ./scripts/config --file out/.config --disable KPM
          fi

          if [[ "${{ inputs.susfs_enable }}" == 'true' ]]; then
            ./scripts/config --file out/.config --enable KSU_SUSFS
            ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_PATH
            ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_MOUNT
            ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_KSTAT
            ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_UNAME
            ./scripts/config --file out/.config --enable KSU_SUSFS_ENABLE_LOG
            ./scripts/config --file out/.config --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            ./scripts/config --file out/.config --enable KSU_SUSFS_OPEN_REDIRECT
            ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_MAP
          else
            ./scripts/config --file out/.config --disable KSU_SUSFS
          fi
          make O=out olddefconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          if [[ "${{ inputs.kpm_enable }}" == 'true' ]]; then grep -q '^CONFIG_KPM=y$' out/.config; fi
          if [[ "${{ inputs.susfs_enable }}" == 'true' ]]; then grep -q '^CONFIG_KSU_SUSFS=y$' out/.config; fi
          grep -E '^CONFIG_(KSU|KPM|KSU_SUSFS|LOCALVERSION|LTO_)' out/.config

      - name: 编译内核 Image
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace/common
          export PATH="$PWD/../clang19/bin:$PWD/../build-tools/bin:$PATH"
          make -j"$(nproc --all)" LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="$PWD/../clang19/bin/clang" LD="$PWD/../clang19/bin/ld.lld" \
            HOSTLD="$PWD/../clang19/bin/ld.lld" LOCALVERSION= O=out KCFLAGS='-O2 -Wno-error' Image
          test -s out/arch/arm64/boot/Image
          expected_release="5.15.180-$FAKE_SUFFIX"
          strings out/arch/arm64/boot/Image | grep -F "Linux version ${expected_release} ("

      - name: 使用官方 AnyKernel3 打包
        id: create_zip
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace
          git clone --depth=1 https://github.com/cctv18/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          cd AnyKernel3
          python3 - <<'PY'
          from pathlib import Path

          path = Path("anykernel.sh")
          source = path.read_text()
          start = source.index("# boot install")
          end = source.index("## end boot install") + len("## end boot install")
          source = source[:start] + """# boot install
          split_boot
          if [ -f \"split_img/ramdisk.cpio\" ]; then
              unpack_ramdisk
              write_boot
          else
              flash_boot
          fi
          ## end boot install
          """
          path.write_text(source)
          PY
          sed -i 's/^kernel.string=.*/kernel.string=OnePlus Ace 2 Pro PJA110 SukiSU Ultra 40901 GKI/' anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=PJA110/' anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=OP5D77L1/' anykernel.sh
          sed -i 's/^device.name3=.*/device.name3=OnePlusAce2Pro/' anykernel.sh
          sed -i 's/^device.name4=.*/device.name4=/' anykernel.sh
          sed -i 's/^device.name5=.*/device.name5=/' anykernel.sh
          bash -n anykernel.sh
          ! grep -q 'zram\|kpn\|KSUD_PATH' anykernel.sh
          cp ../common/out/arch/arm64/boot/Image ./Image
          test -s Image
          if [[ -n "${{ inputs.kernel_suffix }}" ]]; then
            ak3_name="AnyKernel3_SukiSU_40901_5.15_${{ inputs.kernel_suffix }}.zip"
          else
            ak3_name='AnyKernel3_SukiSU_40901_5.15_pja110-fakesuffix.zip'
          fi
          zip -r9 "../$ak3_name" ./*
          printf 'ak3name=%s\n' "$ak3_name" >> "$GITHUB_OUTPUT"
          cat > ak3.log <<EOF
          Device: PJA110 (OnePlus Ace 2 Pro, SM8550)
          Kernel: 5.15.180-$FAKE_SUFFIX
          SukiSU: 40901 [v4.2.0] builtin commit $SUKISU_BUILTIN_COMMIT
          SUSFS commit: $SUSFS_COMMIT
          KPM: ${{ inputs.kpm_enable }} (内置 CONFIG_KPM)
          SUSFS: ${{ inputs.susfs_enable }}
          LZ4/Zstd: not applied (the available patch targets 6.1, not this 5.15 tree)
          Device check: PJA110, OP5D77L1, OnePlusAce2Pro
          EOF
          zip -z "../$ak3_name" < ak3.log

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_zip.outputs.ak3name }}
          path: kernel_workspace/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: release_zips

      - name: 创建发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > release_notes.md <<'EOF'
          ### PJA110 / OnePlus Ace 2 Pro / SM8550
          - 内核：5.15.180，uname 后缀伪装为 `android13-8-o-01174-gae37bb2cf108`
          - SukiSU：官方 `builtin` 分支固定提交，实际版本 40901（v4.2.0）
          - SUSFS：官方 `gki-android13-5.15` 补丁固定提交
          - KPM：编译选项可控，启用时内置进 `Image`
          - LZ4/Zstd：未应用，当前可用补丁不适用于 5.15
          - AnyKernel3：使用官方仓库模板，自动处理设备现有槽位

          这是刷入 `boot` 分区的 GKI 内置内核包。刷入前保留原厂 boot 备份，并先离线检查 ZIP 内容。
          EOF
          gh release create "${{ needs.build.outputs.ak3name }}-${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --title "PJA110-SukiSU-Ultra-40901-5.15.180" \
            --notes-file release_notes.md \
            release_zips/*.zip
